openapi: 3.1.0
info:
  title: New API Risk Platform
  version: 1.0.0
  description: |
    Risk-control gateway and signed request-tracking API between New API and model providers.
servers:
  - url: https://risk.example.com
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}
                  time: {type: string, format: date-time}
  /readyz:
    get:
      operationId: readiness
      responses:
        "200": {description: PostgreSQL is reachable and the service is ready.}
        "503": {description: A required service is unavailable.}
  /gateway/{route}/{providerPath}:
    parameters:
      - name: route
        in: path
        required: true
        schema: {type: string}
      - name: providerPath
        in: path
        required: true
        description: Remaining provider path. The actual server accepts an arbitrary path tail.
        schema: {type: string}
    post:
      operationId: proxyProviderRequest
      security:
        - GatewayBearer: []
        - GatewayHeader: []
      parameters:
        - name: X-Request-ID
          in: header
          schema: {type: string, maxLength: 128}
        - name: X-NewAPI-Request-ID
          in: header
          schema: {type: string, maxLength: 128}
        - name: X-Oneapi-Request-Id
          in: header
          description: Native NewAPI request identifier when forwarded by the channel.
          schema: {type: string, maxLength: 128}
        - name: X-NewAPI-User-ID
          in: header
          schema: {type: string, maxLength: 200}
      requestBody:
        required: false
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: Provider response. The media type follows the upstream provider.
        "555":
          description: Risk decision, audit failure, or normalized provider/model failure.
          headers:
            X-Risk-Request-ID:
              schema: {type: string}
            X-Risk-Error-Code:
              schema: {type: string, const: "555"}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskErrorEnvelope"
        "401": {description: Invalid route credential.}
        "429": {description: Route rate limit exceeded.}
        "503": {description: Gateway or route concurrency limit reached.}
  /api/v1/track/events:
    post:
      operationId: ingestTrackingEvents
      parameters:
        - $ref: "#/components/parameters/TrackingKeyID"
        - $ref: "#/components/parameters/TrackingTimestamp"
        - $ref: "#/components/parameters/TrackingNonce"
        - $ref: "#/components/parameters/TrackingSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TrackingEvent"
                - type: object
                  required: [events]
                  properties:
                    events:
                      type: array
                      minItems: 1
                      maxItems: 1000
                      items:
                        $ref: "#/components/schemas/TrackingEvent"
      responses:
        "202":
          description: Events accepted into the asynchronous persistence path.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, deferred_or_dropped, received_at]
                properties:
                  accepted: {type: integer, minimum: 0}
                  deferred_or_dropped: {type: integer, minimum: 0}
                  received_at: {type: string, format: date-time}
        "400": {description: Invalid event payload.}
        "401": {description: Missing, stale, or invalid signature.}
        "409": {description: Replayed nonce.}
        "413": {description: Payload exceeds 2 MiB.}
        "503": {description: Replay-protection stores are unavailable.}
  /api/admin/v1/login:
    post:
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        "200":
          description: JWT access token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, user]
                properties:
                  access_token: {type: string}
                  token_type: {type: string, const: Bearer}
                  expires_in: {type: integer}
                  user:
                    $ref: "#/components/schemas/AdminUser"
        "401": {description: Invalid credentials.}
        "429": {description: Login rate limit exceeded.}
  /api/admin/v1/cyber-rule-candidates:
    get:
      operationId: listCyberRuleCandidates
      summary: List adaptive rule candidates collected in Shadow-first mode.
      security:
        - AdminBearer: []
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
      responses:
        "200":
          description: Candidate queue and the effective adaptive-learning policy.
          content:
            application/json:
              schema:
                type: object
                required: [items, policy]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/CyberRuleCandidate"}
                  policy: {$ref: "#/components/schemas/AdaptiveRulePolicy"}
        "401": {description: Administrator authentication required.}
  /api/admin/v1/cyber-rule-candidates/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    patch:
      operationId: setCyberRuleCandidateStatus
      summary: Reject a candidate or restore it to Shadow.
      description: Requires the admin role. Promoted candidates are immutable through this endpoint.
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {type: string, enum: [shadow, rejected]}
      responses:
        "200": {description: Candidate status updated.}
        "400": {description: Invalid candidate identifier or status.}
        "401": {description: Administrator authentication required.}
        "403": {description: Admin role required.}
        "404": {description: Candidate not found or already promoted.}
  /api/admin/v1/cyber-rule-candidates/{id}/promote:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    post:
      operationId: promoteCyberRuleCandidate
      summary: Manually promote a Shadow candidate to an enforcing rule.
      description: Requires the admin role. The action must be Review or Block; Allow rules cannot be created from adaptive candidates.
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: {type: string, enum: [review, block]}
      responses:
        "200":
          description: Candidate promoted transactionally and the rule hot-reloaded.
          content:
            application/json:
              schema:
                type: object
                required: [candidate, rule]
                properties:
                  candidate: {$ref: "#/components/schemas/CyberRuleCandidate"}
                  rule: {$ref: "#/components/schemas/CyberRule"}
        "400": {description: Invalid candidate identifier or action.}
        "401": {description: Administrator authentication required.}
        "403": {description: Admin role required.}
        "404": {description: Candidate not found.}
        "409": {description: Candidate is rejected, promoted, or otherwise not promotable.}
  /api/admin/v1/traces:
    get:
      operationId: searchTraces
      summary: Search request traces by time, user, request identifiers, model, route, status, and risk result.
      security:
        - AdminBearer: []
      parameters:
        - {name: q, in: query, description: Case-insensitive contains search across identifiers, user, model, endpoint, route, risk code, source, and tenant. Minimum 3 characters., schema: {type: string, minLength: 3, maxLength: 300}}
        - {name: request_id, in: query, schema: {type: string, maxLength: 128}}
        - {name: newapi_request_id, in: query, schema: {type: string, maxLength: 128}}
        - {name: external_event_id, in: query, schema: {type: string, maxLength: 200}}
        - {name: route_slug, in: query, schema: {type: string, maxLength: 100}}
        - {name: source, in: query, schema: {type: string, enum: [gateway, newapi]}}
        - {name: user_id, in: query, schema: {type: string, maxLength: 200}}
        - {name: user_match, in: query, schema: {type: string, enum: [exact, prefix, contains], default: exact}}
        - {name: tenant_id, in: query, description: Exact match against metadata.tenant_id., schema: {type: string, maxLength: 200}}
        - {name: model, in: query, description: Case-insensitive contains match., schema: {type: string, maxLength: 200}}
        - {name: endpoint, in: query, description: Case-insensitive contains match., schema: {type: string, maxLength: 300}}
        - {name: decision, in: query, schema: {type: string, enum: [allow, block, review, error, unknown]}}
        - {name: risk_code, in: query, schema: {type: string, maxLength: 200}}
        - {name: http_status, in: query, schema: {type: integer, minimum: 0, maximum: 999}}
        - {name: upstream_status, in: query, schema: {type: integer, minimum: 0, maximum: 999}}
        - {name: time_basis, in: query, description: Time column used for filtering and ordering. Defaults to request completion time to align with NewAPI logs., schema: {type: string, enum: [completed, started, ingested], default: completed}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        "200":
          description: Filtered request traces and aggregate counts for the selected range.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset, has_more, from, to, time_basis, server_time, summary]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/TraceEvent"}
                  total: {type: integer, format: int64}
                  limit: {type: integer}
                  offset: {type: integer}
                  has_more: {type: boolean}
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  time_basis: {type: string, enum: [completed, started, ingested]}
                  server_time: {type: string, format: date-time}
                  summary:
                    type: object
                    required: [allowed_requests, blocked_requests, error_requests, review_requests, average_latency_ms]
                    properties:
                      allowed_requests: {type: integer, format: int64}
                      blocked_requests: {type: integer, format: int64}
                      error_requests: {type: integer, format: int64}
                      review_requests: {type: integer, format: int64}
                      average_latency_ms: {type: number, format: double}
        "400": {description: Invalid time range, pagination value, status, or overly broad fuzzy query.}
        "401": {description: Administrator authentication required.}
components:
  securitySchemes:
    GatewayBearer:
      type: http
      scheme: bearer
      description: Route inbound key configured in the visual console.
    GatewayHeader:
      type: apiKey
      in: header
      name: X-Risk-Gateway-Key
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TrackingKeyID:
      name: X-Risk-Key-Id
      in: header
      required: true
      schema: {type: string, minLength: 3, maxLength: 100}
    TrackingTimestamp:
      name: X-Risk-Timestamp
      in: header
      required: true
      schema: {type: string, pattern: "^[0-9]{10,}$"}
    TrackingNonce:
      name: X-Risk-Nonce
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 200}
    TrackingSignature:
      name: X-Risk-Signature
      in: header
      required: true
      description: Hex HMAC-SHA256 over timestamp, nonce, and the SHA-256 of the exact raw body.
      schema: {type: string, pattern: "^(sha256=)?[a-fA-F0-9]{64}$"}
  schemas:
    AdaptiveRulePolicy:
      type: object
      required: [enabled, auto_promote, min_confidence, min_evidence, min_distinct_users, auto_block]
      properties:
        enabled: {type: boolean}
        auto_promote: {type: boolean}
        min_confidence: {type: number, minimum: 0, maximum: 1}
        min_evidence: {type: integer, minimum: 1}
        min_distinct_users: {type: integer, minimum: 0}
        auto_block: {type: boolean}
    CyberRuleCandidate:
      type: object
      required: [id, fingerprint, proposed_code, category, pattern, pattern_type, proposed_action, confidence, evidence_count, distinct_users, status]
      properties:
        id: {type: integer, format: int64}
        fingerprint: {type: string}
        proposed_code: {type: string}
        category: {type: string}
        pattern: {type: string}
        pattern_type: {type: string, enum: [regex, contains, exact]}
        proposed_action: {type: string, enum: [review, block]}
        confidence: {type: number, minimum: 0, maximum: 1}
        model: {type: string}
        route_slug: {type: string}
        provider_error_class: {type: string}
        upstream_status: {type: integer}
        reason: {type: string}
        evidence_count: {type: integer, minimum: 1}
        distinct_users: {type: integer, minimum: 0}
        status: {type: string, enum: [candidate, shadow, promoted, rejected]}
        promoted_rule_id: {type: [integer, "null"], format: int64}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CyberRule:
      type: object
      required: [id, code, name, category, pattern, pattern_type, action, priority, enabled]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        category: {type: string}
        pattern: {type: string}
        pattern_type: {type: string, enum: [regex, contains, exact]}
        action: {type: string, enum: [allow, review, block]}
        priority: {type: integer}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RiskErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code, risk_code, request_id]
          properties:
            message: {type: string}
            type: {type: string, const: risk_control_error}
            code: {type: integer, const: 555}
            risk_code: {type: string}
            request_id: {type: string}
    TrackingEvent:
      type: object
      required: [request_id]
      additionalProperties: false
      properties:
        event_id: {type: string, maxLength: 200}
        request_id: {type: string, maxLength: 128}
        route_slug: {type: string, maxLength: 100}
        newapi_request_id: {type: string, maxLength: 128}
        external_user_id: {type: string, maxLength: 200}
        model: {type: string, maxLength: 200}
        endpoint: {type: string, maxLength: 300}
        decision: {type: string, enum: [allow, block, review, error]}
        risk_code: {type: string, maxLength: 200}
        http_status: {type: integer}
        upstream_status: {type: integer}
        latency_ms: {type: integer, format: int64}
        audit_latency_ms: {type: integer, format: int64}
        request_bytes: {type: integer, format: int64}
        response_bytes: {type: integer, format: int64}
        prompt_hmac: {type: string, maxLength: 128}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        occurred_at: {type: string, format: date-time, description: Backward-compatible completion/event time.}
        metadata:
          type: object
          additionalProperties: true
    TraceEvent:
      allOf:
        - $ref: "#/components/schemas/TrackingEvent"
        - type: object
          properties:
            source: {type: string}
            started_at: {type: string, format: date-time}
            completed_at: {type: string, format: date-time}
            ingested_at: {type: string, format: date-time}
            created_at: {type: string, format: date-time, description: PostgreSQL partition timestamp.}
    AdminUser:
      type: object
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        role: {type: string, enum: [admin, operator, viewer]}
        enabled: {type: boolean}
