name: Pair local credential rotation and public disclosure E2E
on:
  push:
    branches: [fix/local-credential-semantics-v12]
    paths: [.github/workflows/transition-v12.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checked test transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          data = ''
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          assert len(patch) == 4883
          assert hashlib.sha256(patch).hexdigest() == '2b5dea60d3e9c358a916acd35d31d329baa7f3b55f8349ff215f2c82e95a7209'
          Path('/tmp/v12-transition.patch').write_bytes(patch)
          PY
          git apply --check /tmp/v12-transition.patch
          git apply --index /tmp/v12-transition.patch
          bash -n scripts/e2e.sh
          git rm --cached .github/workflows/transition-v12.yml
          git diff --cached --check
          test "$(git write-tree)" = "7b8eaa12de216c408d85fb916a715d7266acf1a5"
          git reset HEAD -- .github/workflows/transition-v12.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(audit): pair ordinary config rotation with public-log denial'
          git push origin HEAD:refs/heads/fix/local-credential-semantics-v12
