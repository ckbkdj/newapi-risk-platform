name: Apply audit structured-output recovery

on:
  workflow_dispatch:
  push:
    branches:
      - fix/audit-structured-output-recovery
    paths:
      - .github/workflows/apply-audit-structured-output-recovery.yml
      - scripts/apply-audit-structured-output-recovery.py
      - scripts/run-audit-structured-output-recovery.py

permissions:
  contents: write

concurrency:
  group: apply-audit-structured-output-recovery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-structured-output-recovery
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-audit-structured-output-recovery.py scripts/run-audit-structured-output-recovery.py
          python3 scripts/run-audit-structured-output-recovery.py
          gofmt -w ./cmd ./internal
      - name: Validate
        run: |
          set -euo pipefail
          git diff --check
          bash -n scripts/e2e.sh scripts/init-env.sh scripts/deploy-local.sh scripts/upgrade.sh scripts/update.sh
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/admin.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/admin.js
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
          rm -f .env
          bash scripts/init-env.sh >/tmp/init-env.txt
          grep -q '^AUDIT_OUTPUT_MAX_TOKENS=256$' .env
          rm -f .env
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add \
            .env.example \
            cmd/mockprovider/main.go \
            deploy/kubernetes.yaml \
            docker-compose.yml \
            docs/audit-structured-output-recovery.md \
            internal/platform/audit.go \
            internal/platform/audit_diagnostics.go \
            internal/platform/audit_failover.go \
            internal/platform/audit_fast_mode.go \
            internal/platform/audit_output_contract.go \
            internal/platform/audit_output_contract_test.go \
            internal/platform/config.go \
            internal/platform/gateway.go \
            internal/platform/types.go \
            internal/platform/web/index.html \
            scripts/e2e.sh \
            scripts/init-env.sh
          if git diff --cached --quiet; then
            echo "implementation already applied"
            exit 0
          fi
          git commit -m "fix(audit): enforce and recover structured policy output"
          git push origin HEAD:fix/audit-structured-output-recovery
