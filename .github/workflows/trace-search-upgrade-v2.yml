name: Apply trace search visualization upgrade v2

on:
  workflow_dispatch:
  push:
    branches:
      - feat/trace-search-visualization
    paths:
      - .github/workflows/trace-search-upgrade-v2.yml

permissions:
  contents: write

concurrency:
  group: trace-search-visualization-upgrade-v2
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/trace-search-visualization
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum

      - name: Preserve literal replacement text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/trace-search-upgrade.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'pattern.subn(trace_js + "      async function loadStorage", ui, count=1)',
              'pattern.subn(lambda _match: trace_js + "      async function loadStorage", ui, count=1)',
          )
          text = text.replace(
              'pattern.subn(trace_openapi, openapi, count=1)',
              'pattern.subn(lambda _match: trace_openapi, openapi, count=1)',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply source update
        run: python3 .github/trace-search-upgrade.py

      - name: Validate source and deployment files
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

      - name: Commit applied feature
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/platform/http.go \
            internal/platform/web/index.html \
            scripts/e2e.sh \
            docs/openapi.yaml \
            docs/newapi-integration.md \
            README.md
          if git diff --cached --quiet; then
            echo "Trace search upgrade already applied."
            exit 0
          fi
          git commit -m "feat(trace): add visual request search [trace-search-applied]"
          git push origin HEAD:feat/trace-search-visualization
