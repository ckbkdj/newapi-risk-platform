name: Apply automatic body, timeline, and role-aware audit

on:
  workflow_dispatch:
  push:
    branches:
      - fix/auto-body-timeline-and-role-aware-audit
    paths:
      - .github/workflows/apply-auto-body-timeline-role-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-body-timeline-and-role-aware-audit
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply integration
        run: |
          set -euo pipefail
          python3 scripts/run-auto-body-timeline-role-audit.py
          gofmt -w ./cmd ./internal
      - name: Validate
        run: |
          set -euo pipefail
          bash -n scripts/e2e.sh scripts/deploy-local.sh scripts/init-env.sh scripts/doctor.sh
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/newapi-risk-admin.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/newapi-risk-admin.js
          rm -f .env
          bash scripts/init-env.sh >/tmp/init-env.txt
          grep -q '^REQUEST_MAX_BYTES=0$' .env
          grep -q '^REQUEST_HARD_MAX_BYTES=67108864$' .env
          grep -q '^REQUEST_LARGE_BODY_MAX_CONCURRENCY=4$' .env
          rm -f .env
      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add \
            .env.example \
            docker-compose.yml \
            docs/automatic-body-timeline-and-role-aware-audit.md \
            internal/platform/audit.go \
            internal/platform/audit_fast_mode.go \
            internal/platform/audit_input_scope.go \
            internal/platform/config.go \
            internal/platform/gateway.go \
            internal/platform/http.go \
            internal/platform/migrations/007_trace_timeline.sql \
            internal/platform/platform_test.go \
            internal/platform/request_limit_source.go \
            internal/platform/request_size_diagnostics_test.go \
            internal/platform/store_traces.go \
            internal/platform/trace_search.go \
            internal/platform/trace_search_test.go \
            internal/platform/trace_timeline.go \
            internal/platform/trace_timeline_test.go \
            internal/platform/types.go \
            internal/platform/web/index.html \
            scripts/e2e.sh \
            scripts/init-env.sh
          if git diff --cached --quiet; then
            echo "integration already applied"
            exit 0
          fi
          git commit -m "fix: auto-size request bodies, align trace time, and isolate user intent"
          git push origin HEAD:fix/auto-body-timeline-and-role-aware-audit
