name: Apply Cyber explainability E2E coverage

on:
  push:
    branches:
      - fix/cyber-rule-explainability-benign-secrets
    paths:
      - .github/workflows/apply-cyber-explainability-e2e.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cyber-rule-explainability-benign-secrets
          fetch-depth: 0
      - name: Apply E2E patch
        run: |
          set -euo pipefail
          python3 scripts/add-cyber-explainability-e2e.py
          bash -n scripts/e2e.sh
      - name: Commit E2E coverage
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add scripts/e2e.sh
          git diff --cached --quiet && { echo 'E2E patch already applied'; exit 0; }
          git commit -m "test(cyber): verify editable rules and explainable own-secret review"
          git push origin HEAD:fix/cyber-rule-explainability-benign-secrets
