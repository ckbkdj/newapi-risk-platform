name: Assemble tested preflight repair
on:
  push:
    branches: [fix/preflight-local-dev-v9]
    paths: [.github/workflows/repair-apply-v9.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preflight-local-dev-v9
      - name: Apply checksum-verified patch and verify clean source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.repair-v9/{i}').read_text().strip() for i in range(5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1fb24f5e92e0d1456b6a1e244e67e1608e29791fed9c9b7197096c6b6d0686ec', 'patch checksum mismatch'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          temporary = ['.repair-v9', '.github/workflows/repair-source-v9.yml', '.github/workflows/repair-apply-v9.yml']
          subprocess.run(['git', 'rm', '-r', '--cached', '--', *temporary], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          print('Verified clean source tree:', tree)
          assert tree == 'd7b14a6b079460a1e24fdfbb4a84c71bd8575454', 'source tree mismatch'
          # Keep transport files unchanged in this bot commit. A subsequent
          # connector commit removes them before the PR is opened.
          subprocess.run(['git', 'reset', '-q', 'HEAD', '--', *temporary], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(audit): preflight diagnostics, bounded capacity and local development evidence'
          git push origin HEAD:refs/heads/fix/preflight-local-dev-v9
