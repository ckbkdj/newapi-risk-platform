name: Apply request-size diagnostics integration

on:
  workflow_dispatch:
  push:
    branches:
      - fix/request-too-large-size-diagnostics
    paths:
      - .github/workflows/apply-request-size-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/request-too-large-size-diagnostics
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 scripts/prepare-request-size-patch.py
          python3 scripts/apply-request-size-diagnostics.py
          python3 scripts/apply-request-size-followup.py
          python3 scripts/apply-request-size-ui-current.py
          gofmt -w ./cmd ./internal
      - name: Validate
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          bash -n scripts/init-env.sh scripts/deploy-local.sh scripts/doctor.sh scripts/e2e.sh
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          POSTGRES_PASSWORD=test-password MASTER_KEY_B64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= JWT_SECRET=0123456789abcdef0123456789abcdef BOOTSTRAP_ADMIN_PASSWORD=0123456789abcdef docker compose config --quiet
          POSTGRES_PASSWORD=test-password MASTER_KEY_B64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY= JWT_SECRET=0123456789abcdef0123456789abcdef BOOTSTRAP_ADMIN_PASSWORD=0123456789abcdef docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/newapi-risk-admin.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/newapi-risk-admin.js
      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add \
            .env.example \
            .github/workflows/ci.yml \
            docker-compose.yml \
            docker-compose.test.yml \
            docs/qwen38-fast-audit.md \
            docs/request-size-and-context-limits.md \
            internal/platform/audit_diagnostics.go \
            internal/platform/config.go \
            internal/platform/gateway.go \
            internal/platform/request_size_diagnostics_test.go \
            internal/platform/web/index.html \
            scripts/e2e.sh \
            scripts/init-env.sh
          git diff --cached --quiet && { echo 'No integration changes'; exit 0; }
          git commit -m "fix(gateway): expose oversized request size and remove fixed audit token cap"
          git push origin HEAD:fix/request-too-large-size-diagnostics
