name: Fix Cyber explainability gofmt

on:
  push:
    branches:
      - fix/cyber-rule-explainability-benign-secrets
    paths:
      - .github/workflows/fix-cyber-gofmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cyber-rule-explainability-benign-secrets
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - run: gofmt -w internal/platform/cyber_rule_explainability.go internal/platform/cyber_rule_explainability_test.go internal/platform/types.go internal/platform/audit.go internal/platform/gateway.go
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add internal/platform/cyber_rule_explainability.go internal/platform/cyber_rule_explainability_test.go internal/platform/types.go internal/platform/audit.go internal/platform/gateway.go
          git diff --cached --quiet && exit 0
          git commit -m "chore: gofmt Cyber explainability sources"
          git push origin HEAD:fix/cyber-rule-explainability-benign-secrets
