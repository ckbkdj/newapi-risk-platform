name: Apply precision-first engineering audit

on:
  workflow_dispatch:
  push:
    branches:
      - fix/precision-first-engineering-audit
    paths:
      - .github/workflows/apply-precision-first-engineering-audit.yml
      - scripts/apply-precision-first-engineering-audit.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/precision-first-engineering-audit
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply integration
        run: |
          set -euo pipefail
          python3 scripts/apply-precision-first-engineering-audit.py
          gofmt -w ./cmd ./internal
      - name: Validate
        run: |
          set -euo pipefail
          bash -n scripts/e2e.sh scripts/init-env.sh scripts/deploy-local.sh scripts/doctor.sh
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/newapi-risk-admin.js').write_text('\n'.join(scripts), encoding='utf-8')
          migration = Path('internal/platform/migrations/008_precision_first_engineering_policy.sql').read_text(encoding='utf-8')
          for expected in ('CYBER_CREDENTIAL_ACCESS_REVIEW','CYBER_EXPLICIT_C2_DEPLOYMENT','internal_engineering','cyber_adaptive_auto_promote'):
              if expected not in migration:
                  raise SystemExit(f'migration marker missing: {expected}')
          PY
          node --check /tmp/newapi-risk-admin.js
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add \
            cmd/mockprovider/main.go \
            docs/precision-first-engineering-audit.md \
            internal/platform/adaptive_rules.go \
            internal/platform/audit.go \
            internal/platform/audit_fast_mode.go \
            internal/platform/audit_input_scope.go \
            internal/platform/audit_policy.go \
            internal/platform/audit_precision_test.go \
            internal/platform/audit_rule_units.go \
            internal/platform/context_claim_guard.go \
            internal/platform/context_claim_guard_test.go \
            internal/platform/cyber_rule_explainability.go \
            internal/platform/gateway.go \
            internal/platform/migrations/008_precision_first_engineering_policy.sql \
            internal/platform/store.go \
            internal/platform/types.go \
            internal/platform/web/index.html \
            scripts/e2e.sh
          if git diff --cached --quiet; then
            echo "implementation already applied"
            exit 0
          fi
          git commit -m "fix(audit): apply precision-first internal engineering policy"
          git push origin HEAD:fix/precision-first-engineering-audit
