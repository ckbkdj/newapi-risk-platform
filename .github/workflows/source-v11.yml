name: Export pinned audit v10 source
on:
  push:
    branches: [fix/escaped-observation-android-v11]
    paths: [.github/workflows/source-v11.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d8b1ea44559fd6e662a07ae11a4400f9458bffe
      - run: git archive --format=tar.gz HEAD > /tmp/audit-v10-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: audit-v10-source
          path: /tmp/audit-v10-source.tar.gz
          retention-days: 1
