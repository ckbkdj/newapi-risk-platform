name: Assemble reviewed v15 candidate
on:
  push:
    branches: [fix/script-development-evidence-v15]
    paths: [.github/workflows/assemble-v15.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'ckbkdj/newapi-risk-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed patch and verify complete resulting tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = f0f6f0e43840f19c56bc99baedb83487d85bb988
          test "$(git diff HEAD^ HEAD --name-only)" = .github/workflows/assemble-v15.yml
          cat > "$RUNNER_TEMP/v15.b64" <<'BASE64'
          
          
          
          
          BASE64
          python3 - <<'PY'
          import base64,hashlib,lzma,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          compressed=base64.b64decode((root/'v15.b64').read_text())
          assert hashlib.sha256(compressed).hexdigest()=='001d8a06126b5bc2ccb75c6c77b770b24b2511861d768ce94895b601a34b3037'
          (root/'v15.patch').write_bytes(lzma.decompress(compressed))
          PY
          git apply --check --index --unidiff-zero "$RUNNER_TEMP/v15.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/v15.patch"
          git update-index --force-remove .github/workflows/assemble-v15.yml
          test "$(git write-tree)" = d7a6399ab210eaa16fe976aee66374aea92aef45
          git add .github/workflows/assemble-v15.yml
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/fix/script-development-evidence-v15 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(audit): ground script testing and cross-field evidence without Cyber exemptions (v15)'
          git push origin HEAD:refs/heads/fix/script-development-evidence-v15
          git rev-parse HEAD
