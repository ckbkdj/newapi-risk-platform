name: Assemble validated evidence source repair
on:
  push:
    branches: [fix/evidence-source-repair-v8]
    paths: [.github/workflows/repair-apply-v8.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-source-repair-v8
      - name: Apply exact validated patch without changing workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          files = sorted(Path('.repair-v8').glob('*.b64'))
          assert [p.name for p in files] == ['00.b64', '01.b64', '02.b64', '03.b64']
          encoded = ''.join(p.read_text().strip() for p in files)
          assert len(encoded) == 28364
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'cd6c702d2892860d6680ba314823f2b824a40b038863f09e80ad8037daca8634'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 70885
          Path('/tmp/repair-v8.patch').write_bytes(patch)
          PY
          git apply --check /tmp/repair-v8.patch
          git apply --index /tmp/repair-v8.patch
          git rm -r .repair-v8
          index_file=$(mktemp)
          cp .git/index "$index_file"
          GIT_INDEX_FILE="$index_file" git update-index --force-remove .github/workflows/repair-apply-v8.yml
          tree=$(GIT_INDEX_FILE="$index_file" git write-tree)
          rm "$index_file"
          echo "Validated final source tree: $tree"
          test "$tree" = 80c0963a13a631dee1533bb9e9c4e0a32f4b1b50
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(audit): recover ungrounded evidence once and verify dispatched source'
          git push origin HEAD:refs/heads/fix/evidence-source-repair-v8
