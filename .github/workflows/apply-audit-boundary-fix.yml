name: Apply and validate audit intent repair
on:
  push:
    branches: [fix/audit-evidence-boundaries]
    paths: [.github/workflows/apply-audit-boundary-fix.yml]
permissions:
  contents: write
concurrency:
  group: apply-audit-boundary-fix
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'ckbkdj/newapi-risk-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Apply hash-verified tracked-source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/audit-evidence-boundaries
          git merge-base --is-ancestor 03b06daa849dbb9d7f9391a163c112621c4e32f4 HEAD
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          shas = ['fab8fdc27e2febb6c0d0292459ddd2b2f60e9950', '1385ed896e9844e15b6d94383ab123f81205fcf1', '840eafbb9f895e7da5e32522bc7adfc3b7bedc89']
          compressed = bytearray()
          for sha in shas:
              value = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              assert value['encoding'] == 'base64'
              compressed.extend(base64.b64decode(value['content']))
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '09b31c35f13cddb8077608443d681a79d467ff4992cdba77eaace5683ce040d0'
          pathlib.Path('/tmp/audit-boundary-fix.patch').write_bytes(patch)
          PY
          git apply --check /tmp/audit-boundary-fix.patch
          git apply --index /tmp/audit-boundary-fix.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 22
          if git diff --cached --name-only | grep -Ev '^(cmd/|internal/|docs/|scripts/|tests/)'; then
            echo 'Unexpected patch path' >&2
            exit 1
          fi
      - name: Verify complete repair before committing
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          go test -race -count=1 -timeout=10m ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          bash -n scripts/e2e.sh scripts/upgrade.sh scripts/upgrade_test.sh
          bash scripts/upgrade_test.sh
          python3 -m py_compile scripts/eval-audit-intent.py
      - name: Commit only verified source to repair branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(audit): separate request provenance and require semantic evidence verification'
          git push origin HEAD:refs/heads/fix/audit-evidence-boundaries
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
