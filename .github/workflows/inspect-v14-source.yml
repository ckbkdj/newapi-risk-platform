name: Export pinned v13 source
on:
  push:
    branches: [fix/full-request-audit-v14]
    paths: [.github/workflows/inspect-v14-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4ec5741a9b45f46191c1aea6c4d27f5c5899c58a
          persist-credentials: false
      - run: git archive --format=tar.gz --output="$RUNNER_TEMP/audit-v13-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: audit-v13-source
          path: ${{ runner.temp }}/audit-v13-source.tar.gz
          retention-days: 1
