name: Assemble validated database audit repair
on:
  push:
    branches: [fix/db-sync-evidence-v7]
    paths: [.github/workflows/repair-apply-v7.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/db-sync-evidence-v7
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Apply reviewed edits and remove transport files
        run: |
          set -euo pipefail
          python3 .repair-db-sync/apply.py
          rm -rf .repair-db-sync
          rm .github/workflows/repair-source-export.yml .github/workflows/repair-deps-export.yml .github/workflows/repair-apply-v7.yml
          git add -A
          TREE=$(git write-tree)
          echo "Prepared source tree: ${TREE}"
          git archive --format=tar "${TREE}" > /tmp/prepared-v7.tar
          if [ "${TREE}" != aeb9f39095e9c1358b6a79e94e32f15678d50e1a ]; then
            git ls-files --stage
            echo 'Prepared source does not match the locally tested tree'
            exit 1
          fi
          git diff --cached --check
          git config user.name 'ckbkdj'
          git config user.email '9382231+ckbkdj@users.noreply.github.com'
          git commit -m 'fix(audit): ground database sync evidence and account for complete bounded chunk audits'
          git push origin HEAD:refs/heads/fix/db-sync-evidence-v7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prepared-v7
          path: /tmp/prepared-v7.tar
          if-no-files-found: ignore
          retention-days: 1
