name: Apply verified audit incident repair

on:
  push:
    branches: [fix/aosp-adb-audit-context]
    paths: [.github/workflows/apply-audit-incident-fix.yml]

permissions:
  contents: write

concurrency:
  group: apply-audit-incident-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'ckbkdj/newapi-risk-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Apply hash-verified source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/aosp-adb-audit-context
          git merge-base --is-ancestor e5670e597749ff32f0f14fdca047eb48cbfd1ed3 HEAD
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          shas = ['0a453541b125bcf3fe0d0ec045d437195a76df50', '47650112ca73775991d99d2e9f2d0840d10e78ac']
          compressed = bytearray()
          for sha in shas:
              value = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              assert value['encoding'] == 'base64'
              compressed.extend(base64.b64decode(value['content']))
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'e8ae0d9511e68b4f828886977993e2b32c12530a4ce55e8b2ee09de7e9d4caef'
          pathlib.Path('/tmp/audit-fix.patch').write_bytes(patch)
          PY
          git apply --check /tmp/audit-fix.patch
          git apply --index /tmp/audit-fix.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 18
          if git diff --cached --name-only | grep -Ev '^(cmd/|internal/|docs/|scripts/)'; then
            echo 'Unexpected source patch path' >&2
            exit 1
          fi
      - name: Validate complete repair before committing
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          go test -race -count=1 -timeout=10m ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          bash -n scripts/e2e.sh scripts/upgrade.sh scripts/upgrade_test.sh
          bash scripts/upgrade_test.sh
      - name: Commit only validated source files to repair branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(audit): recover context limits and permit routine AOSP/ADB administration'
          git push origin HEAD:refs/heads/fix/aosp-adb-audit-context
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
