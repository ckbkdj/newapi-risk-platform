name: Apply adaptive promotion monotonic fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/trace-upstream-stream-failure-reason
    paths:
      - .github/workflows/apply-adaptive-promotion-monotonic.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trace-upstream-stream-failure-reason
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 scripts/apply-adaptive-promotion-monotonic.py
          gofmt -w internal/platform/adaptive_rules.go
          go test -race -count=1 ./...
          go vet ./...
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add internal/platform/adaptive_rules.go
          if git diff --cached --quiet; then
            echo "already applied"
            exit 0
          fi
          git commit -m "fix(cyber): prevent adaptive block promotion downgrade race"
          git push origin HEAD:fix/trace-upstream-stream-failure-reason
