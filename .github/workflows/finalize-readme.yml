name: Finalize standalone README

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update standalone repository instructions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '> 本目录是独立 Go 服务，不改动仓库原有 Android 工程。',
              '> 本仓库是独立 Go 服务，正式维护地址为 `ckbkdj/newapi-risk-platform`。',
          )
          text = text.replace(
              '```bash\ncd newapi-risk-platform\ncp .env.example .env',
              '```bash\ngit clone https://github.com/ckbkdj/newapi-risk-platform.git\ncd newapi-risk-platform\ncp .env.example .env',
          )
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: finalize standalone repository instructions"
          git push origin HEAD:main
