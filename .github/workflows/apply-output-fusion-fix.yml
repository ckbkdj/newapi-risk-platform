name: Apply audit output and fusion repair
on:
  push:
    branches: [fix/audit-output-resilience]
    paths: [.github/workflows/apply-output-fusion-fix.yml]
permissions:
  contents: write
concurrency:
  group: apply-output-fusion-fix
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'ckbkdj/newapi-risk-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Apply hash-verified repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/audit-output-resilience
          git merge-base --is-ancestor e2b64c05fc0bdf4a42aa3c63e867f83ac78c1557 HEAD
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          shas = ['b212fe184fb5babec5ff8ff924a4b174c70ea81f', '06d8cb4e89e159b2f4f89e933f1bf4c4ff71ae72', 'c78e270f51e17fe7d61ef9023d70636e53c2ca7a']
          compressed = bytearray()
          for sha in shas:
              value = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              assert value['encoding'] == 'base64'
              compressed.extend(base64.b64decode(value['content']))
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '4e91125ed4418c6c0cc79de25cf98c65397fdcf8c7da7084edf1d3647988384e'
          pathlib.Path('/tmp/output-fusion.patch').write_bytes(patch)
          PY
          git apply --check /tmp/output-fusion.patch
          git apply --index /tmp/output-fusion.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 29
          if git diff --cached --name-only | grep -Ev '^(cmd/|internal/|docs/|scripts/|\.github/workflows/ci\.yml$|\.gitignore$)'; then
            echo 'Unexpected source patch path' >&2
            exit 1
          fi
      - name: Verify full repair before committing
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          go test -race -count=1 -timeout=10m ./...
          go vet ./...
          go test ./internal/platform -run '^$' -fuzz '^FuzzAuditOutputDecode$' -fuzztime=10s -parallel=2
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          bash -n scripts/e2e.sh scripts/upgrade.sh scripts/upgrade_test.sh scripts/collect-audit-diagnostics.sh scripts/deploy-local.sh
          bash scripts/upgrade_test.sh
          python3 scripts/test_collect_audit_diagnostics.py
          python3 -m py_compile scripts/collect-audit-diagnostics.py scripts/e2e-audit-fusion.py
      - name: Commit validated source to repair branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(audit): resilient output decoding, bounded fusion and private diagnostics'
          git push origin HEAD:refs/heads/fix/audit-output-resilience
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
