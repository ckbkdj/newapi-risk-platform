name: Bootstrap standalone migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-migrate.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-standalone-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out source project and migrate it to repository root
        env:
          SOURCE_REPOSITORY: ckbkdj/proxy
          SOURCE_BRANCH: feat/newapi-risk-platform-release-20260901
          SOURCE_COMMIT: 650a61815639bae568d9c1e1ed487aaf2c163f43
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          trap 'rm -rf "$source_dir"' EXIT

          git clone --depth 1 --branch "$SOURCE_BRANCH" \
            "https://github.com/${SOURCE_REPOSITORY}.git" "$source_dir/source"

          actual_source_commit="$(git -C "$source_dir/source" rev-parse HEAD)"
          if [[ "$actual_source_commit" != "$SOURCE_COMMIT" ]]; then
            echo "Source branch moved: expected $SOURCE_COMMIT, got $actual_source_commit" >&2
            exit 1
          fi

          rsync -a "$source_dir/source/newapi-risk-platform/" ./

          mkdir -p .github/workflows
          cp "$source_dir/source/.github/workflows/newapi-risk-platform-ci.yml" \
            .github/workflows/ci.yml
          cp "$source_dir/source/.github/workflows/newapi-risk-platform-e2e.yml" \
            .github/workflows/e2e.yml

          python3 - <<'PY'
          from pathlib import Path

          old_module = "github.com/ckbkdj/proxy/newapi-risk-platform"
          new_module = "github.com/ckbkdj/newapi-risk-platform"
          old_branch = "feat/newapi-risk-platform-release-20260901"

          text_suffixes = {
              ".go", ".mod", ".sum", ".md", ".yaml", ".yml", ".json",
              ".html", ".css", ".js", ".sql", ".sh", ".txt", ".example",
          }
          exact_text_names = {
              "Dockerfile", "Dockerfile.mockprovider", "Makefile",
              ".dockerignore", ".gitignore", ".env.example",
          }

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix not in text_suffixes and path.name not in exact_text_names:
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace(old_module, new_module)
              text = text.replace(
                  "https://github.com/ckbkdj/proxy/tree/" + old_branch + "/newapi-risk-platform",
                  "https://github.com/ckbkdj/newapi-risk-platform",
              )
              text = text.replace(
                  "https://github.com/ckbkdj/proxy/blob/" + old_branch + "/newapi-risk-platform/",
                  "https://github.com/ckbkdj/newapi-risk-platform/blob/main/",
              )
              path.write_text(text, encoding="utf-8")

          workflow_specs = (
              (Path(".github/workflows/ci.yml"), "newapi-risk-platform-ci.yml"),
              (Path(".github/workflows/e2e.yml"), "newapi-risk-platform-e2e.yml"),
          )
          for path, old_name in workflow_specs:
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "      - feat/newapi-risk-platform-release-20260901\n",
                  "      - main\n",
              )
              text = text.replace(
                  "      - newapi-risk-platform/**\n      - .github/workflows/" + old_name + "\n",
                  "      - '**'\n",
              )
              text = text.replace(
                  "    defaults:\n      run:\n        working-directory: newapi-risk-platform\n",
                  "",
              )
              path.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          provenance = """

## 独立仓库来源

本仓库于 2026-09-02 从 `ckbkdj/proxy` 的临时功能分支迁移而来，源提交为
`650a61815639bae568d9c1e1ed487aaf2c163f43`。项目现在以独立仓库维护；
`ckbkdj/proxy` 不再作为本项目的发布或部署来源。
"""
          if "## 独立仓库来源" not in text:
              text += provenance
          readme.write_text(text, encoding="utf-8")

          Path("docs/validation-status.md").write_text(
              "# Validation status\n\n"
              "Standalone migration source: `ckbkdj/proxy@650a61815639bae568d9c1e1ed487aaf2c163f43`.\n\n"
              "The canonical repository is now `ckbkdj/newapi-risk-platform`. "
              "Use the latest `CI` and `E2E` workflow runs on `main` as the release gate.\n",
              encoding="utf-8",
          )
          PY

          rm -f .github/workflows/bootstrap-migrate.yml

      - name: Validate migrated source
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go mod tidy
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

      - name: Commit standalone project
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: migrate NewAPI risk platform to standalone repository"
          git push origin HEAD:main
