name: Apply cyber adaptive privacy hardening

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cyber-rule-expansion-adaptive-learning
    paths:
      - .github/workflows/apply-cyber-adaptive-v2.yml

permissions:
  contents: write

concurrency:
  group: apply-cyber-adaptive-privacy-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/cyber-rule-expansion-adaptive-learning
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum

      - name: Apply privacy guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/platform/adaptive_rules.go')
          text = path.read_text(encoding='utf-8')
          old = '''\t\tif indicator == "" || len(indicator) > 80 || strings.ContainsAny(indicator, "\\r\\n") {\n\t\t\tcontinue\n\t\t}'''
          new = '''\t\tif indicator == "" || len(indicator) > 80 || strings.ContainsAny(indicator, "\\r\\n") || adaptiveIndicatorLooksSensitive(indicator) {\n\t\t\tcontinue\n\t\t}'''
          if new not in text:
              if old not in text:
                  raise SystemExit('adaptive indicator validation anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate source
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          bash -n scripts/e2e.sh scripts/deploy-local.sh scripts/init-env.sh scripts/doctor.sh
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider

      - name: Commit privacy hardening
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/platform/adaptive_rules.go
          if git diff --cached --quiet; then
            echo "Privacy hardening already applied."
            exit 0
          fi
          git commit -m "fix(cyber): filter sensitive adaptive indicators"
          git push origin HEAD:feat/cyber-rule-expansion-adaptive-learning
