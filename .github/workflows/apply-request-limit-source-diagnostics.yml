name: Apply request-limit source diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - fix/request-too-large-source-diagnostics
    paths:
      - .github/workflows/apply-request-limit-source-diagnostics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/request-too-large-source-diagnostics
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply source attribution patch
        run: |
          set -euo pipefail
          python3 scripts/apply-request-limit-source-diagnostics.py
          gofmt -w ./cmd ./internal
      - name: Validate
        run: |
          set -euo pipefail
          bash -n scripts/e2e.sh scripts/deploy-local.sh scripts/init-env.sh scripts/doctor.sh
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/admin.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/admin.js
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add \
            docs/request-size-and-context-limits.md \
            internal/platform/gateway.go \
            internal/platform/request_limit_source.go \
            internal/platform/request_size_diagnostics_test.go \
            internal/platform/web/index.html \
            scripts/e2e.sh
          if git diff --cached --quiet; then
            echo "implementation already applied"
            exit 0
          fi
          git commit -m "fix(trace): identify Risk Gateway request-body limit source"
          git push origin HEAD:fix/request-too-large-source-diagnostics
