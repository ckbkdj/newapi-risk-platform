name: Export pinned source for v12 regression repair
on:
  push:
    branches: [fix/local-credential-semantics-v12]
    paths: [.github/workflows/source-v12.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7ff134e461c4ccb0ceacc4c6253967a45822af3
      - run: git archive --format=tar.gz -o /tmp/audit-v11-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: audit-v11-source
          path: /tmp/audit-v11-source.tar.gz
          retention-days: 1
