name: Assemble verified audit v10 repair
on:
  push:
    branches: [fix/audit-negation-retry-v10]
    paths: [.github/workflows/assemble-v10.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply pinned patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.repair-v10/part{i}.b64').read_text().strip() for i in range(3))
          assert len(encoded) == 24860, 'transport size mismatch'
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 64005, 'patch size mismatch'
          assert hashlib.sha256(patch).hexdigest() == '897859323e8255bb47e9e038b2c4fbcb354defbf235ed0ad7f28f140f97f61d5', 'patch digest mismatch'
          Path('/tmp/v10.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/v10.patch
          git apply --index --unidiff-zero /tmp/v10.patch
          git rm -r .repair-v10
          git rm .github/workflows/source-v10.yml .github/workflows/assemble-v10.yml
          git diff --cached --check
          test "$(git write-tree)" = "44046051319e55160c4f40579f560bbb2501dee0"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(audit): negation, bounded chunk resume and private output diagnostics (v10)'
          git push origin HEAD:refs/heads/fix/audit-negation-retry-v10
