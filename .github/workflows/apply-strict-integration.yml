name: Apply verified Cyber coverage integration
on:
  push:
    branches: [fix/audit-intent-coverage-20260909]
    paths: [.github/workflows/apply-strict-integration.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'ckbkdj/newapi-risk-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Verify authored patch and integrate without dropping concurrent changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.strict-integration/part{i}.b64').read_text().strip() for i in range(4))
          assert len(encoded) == 19208, len(encoded)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 43480, len(patch)
          assert hashlib.sha256(patch).hexdigest() == '61ffa92b9bfc5ad4d7abfd99ed73778bb03d26386ae946d4ac1a2f48ebb58dcd'
          Path('/tmp/integration.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/integration.patch
          git apply --unidiff-zero --index /tmp/integration.patch
          git rm -r .strict-integration
          # Actions contents token cannot amend workflows. The connected
          # repository writer applies CI changes and removes temporary
          # workflows in a separate commit after this source validation.
          git restore --source=HEAD --staged --worktree .github/workflows
          git diff --cached --check
      - name: Full validation
        run: |
          set -euo pipefail
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          bash scripts/upgrade_test.sh
          python3 scripts/test_collect_audit_diagnostics.py
          python3 -m py_compile scripts/e2e-cyber-expanded.py scripts/eval-audit-intent.py
          bash -n scripts/e2e.sh
      - name: Commit validated source without workflow changes
        run: |
          set -euo pipefail
          test ! -e .strict-integration
          git diff --cached --exit-code -- .github/workflows
          git config user.name 'ckbkdj'
          git config user.email '9382231+ckbkdj@users.noreply.github.com'
          git commit -m 'fix(audit): cover testing, web automation, CLI and tool-data Cyber intents'
          git push origin HEAD:fix/audit-intent-coverage-20260909
