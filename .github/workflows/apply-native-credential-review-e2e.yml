name: Apply native credential Review E2E assertions

on:
  workflow_dispatch:
  push:
    branches:
      - fix/precision-first-engineering-audit
    paths:
      - .github/workflows/apply-native-credential-review-e2e.yml
      - scripts/apply-native-credential-review-e2e.py

permissions:
  contents: write

concurrency:
  group: apply-native-credential-review-e2e
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/precision-first-engineering-audit
          fetch-depth: 0
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-native-credential-review-e2e.py
          python3 scripts/apply-native-credential-review-e2e.py
          bash -n scripts/e2e.sh
          git diff --check
          grep -Fq 'CYBER_CREDENTIAL_ACCESS_REVIEW' scripts/e2e.sh
          if grep -Fq 'own-secret request did not match credential rule first' scripts/e2e.sh; then
            echo 'legacy credential assertion is still present' >&2
            exit 1
          fi
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add scripts/e2e.sh
          if git diff --cached --quiet; then
            echo "assertions already applied"
            exit 0
          fi
          git commit -m "test(audit): assert native credential Review semantics"
          git push origin HEAD:fix/precision-first-engineering-audit
