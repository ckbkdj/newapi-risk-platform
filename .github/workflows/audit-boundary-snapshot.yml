name: Audit boundary source snapshot
on:
  push:
    branches: [fix/audit-evidence-boundaries]
    paths: [.github/workflows/audit-boundary-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source only
        run: git archive --format=tar.gz --output=/tmp/audit-boundary-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: audit-boundary-source
          path: /tmp/audit-boundary-source.tar.gz
          retention-days: 1
          if-no-files-found: error
