name: Finalize automatic body, timeline, and role-aware audit

on:
  workflow_dispatch:
  push:
    branches:
      - fix/auto-body-timeline-and-role-aware-audit
    paths:
      - .github/workflows/finalize-auto-body-timeline-role-audit.yml
      - scripts/finalize-auto-body-timeline-role-audit.py
      - scripts/run-finalize-auto-body-timeline-role-audit.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-body-timeline-and-role-aware-audit
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply final integration
        run: |
          set -euo pipefail
          python3 scripts/run-finalize-auto-body-timeline-role-audit.py
          gofmt -w ./cmd ./internal
      - name: Validate source and deployment files
        run: |
          set -euo pipefail
          bash -n scripts/e2e.sh scripts/deploy-local.sh scripts/init-env.sh scripts/doctor.sh
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/newapi-risk-admin.js').write_text('\n'.join(scripts), encoding='utf-8')

          k8s = Path('deploy/kubernetes.yaml').read_text(encoding='utf-8')
          for expected in (
              'REQUEST_MAX_BYTES: "0"',
              'REQUEST_HARD_MAX_BYTES: "67108864"',
              'REQUEST_LARGE_BODY_MAX_CONCURRENCY: "4"',
              'AUDIT_TEXT_MAX_BYTES: "8388608"',
          ):
              if expected not in k8s:
                  raise SystemExit(f'Kubernetes setting missing: {expected}')
          openapi = Path('docs/openapi.yaml').read_text(encoding='utf-8')
          for expected in ('X-Oneapi-Request-Id', 'time_basis', 'started_at', 'completed_at', 'ingested_at'):
              if expected not in openapi:
                  raise SystemExit(f'OpenAPI timeline/correlation field missing: {expected}')
          PY
          node --check /tmp/newapi-risk-admin.js
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
          rm -f .env
          bash scripts/init-env.sh >/tmp/init-env.txt
          grep -q '^REQUEST_MAX_BYTES=0$' .env
          grep -q '^REQUEST_HARD_MAX_BYTES=67108864$' .env
          grep -q '^REQUEST_LARGE_BODY_THRESHOLD_BYTES=8388608$' .env
          grep -q '^REQUEST_LARGE_BODY_MAX_CONCURRENCY=4$' .env
          rm -f .env
      - name: Commit final integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add \
            deploy/kubernetes.yaml \
            docker-compose.test.yml \
            docs/automatic-body-timeline-and-role-aware-audit.md \
            docs/openapi.yaml \
            internal/platform/admin.go \
            internal/platform/gateway.go \
            internal/platform/web/index.html \
            scripts/e2e.sh
          if git diff --cached --quiet; then
            echo "final integration already applied"
            exit 0
          fi
          git commit -m "fix: correlate NewAPI requests and verify automatic large-body admission"
          git push origin HEAD:fix/auto-body-timeline-and-role-aware-audit
