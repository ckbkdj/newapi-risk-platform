name: Export source snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - feat/multimodal-artifact-audit
    paths:
      - .github/workflows/export-source-snapshot.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
