name: New API Risk Platform CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: newapi-risk-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Verify deployment scripts and generated environment
        run: |
          set -euo pipefail
          bash -n scripts/init-env.sh scripts/deploy-local.sh scripts/doctor.sh scripts/e2e.sh
          bash scripts/init-env.sh >/tmp/init-env-output.txt
          python3 - <<'PY'
          import base64
          from pathlib import Path

          values = {}
          for line in Path('.env').read_text(encoding='utf-8').splitlines():
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              values[key] = value
          assert len(base64.b64decode(values['MASTER_KEY_B64'], validate=True)) == 32
          assert len(values['JWT_SECRET'].encode()) >= 32
          assert len(values['BOOTSTRAP_ADMIN_PASSWORD']) >= 14
          assert values['POSTGRES_PASSWORD']
          assert values['HTTP_PORT'] == '8080'
          assert values['AUDIT_TEXT_MAX_BYTES'] == '8388608'
          assert values['AUDIT_OUTPUT_MAX_TOKENS'] == '128'
          assert values['AUDIT_DISABLE_THINKING'] == 'true'
          assert values['AUDIT_LONG_CONTEXT_THRESHOLD_BYTES'] == '131072'
          assert values['AUDIT_LONG_CONTEXT_TIMEOUT'] == '120s'
          assert values['AUDIT_CONTEXT_TARGET_TOKENS'] == '260000'
          assert values['AUDIT_FALLBACK_CHUNK_BYTES'] == '196608'
          assert values['AUDIT_CHUNK_OVERLAP_BYTES'] == '4096'
          assert values['AUDIT_CHUNK_CONCURRENCY'] == '2'
          assert values['AUDIT_MAX_CHUNKS'] == '64'

          # Reproduce an old deployment. The old 262144 value was a byte cap,
          # and old versions had no request-side chunk configuration.
          removed = {
              'AUDIT_OUTPUT_MAX_TOKENS',
              'AUDIT_DISABLE_THINKING',
              'AUDIT_LONG_CONTEXT_THRESHOLD_BYTES',
              'AUDIT_LONG_CONTEXT_TIMEOUT',
              'AUDIT_CONTEXT_TARGET_TOKENS',
              'AUDIT_FALLBACK_CHUNK_BYTES',
              'AUDIT_CHUNK_OVERLAP_BYTES',
              'AUDIT_CHUNK_CONCURRENCY',
              'AUDIT_MAX_CHUNKS',
          }
          migrated = []
          for line in Path('.env').read_text(encoding='utf-8').splitlines():
              key = line.split('=', 1)[0] if '=' in line else ''
              if key in removed:
                  continue
              if key == 'AUDIT_TEXT_MAX_BYTES':
                  line = 'AUDIT_TEXT_MAX_BYTES=262144'
              migrated.append(line)
          migrated.append('AUDIT_PROMPT_TRUNCATE_TOKENS=260000')
          Path('.env').write_text('\n'.join(migrated) + '\n', encoding='utf-8')
          PY
          bash scripts/init-env.sh >/tmp/init-env-migration-output.txt
          python3 - <<'PY'
          from pathlib import Path

          values = {}
          for line in Path('.env').read_text(encoding='utf-8').splitlines():
              if line and not line.startswith('#') and '=' in line:
                  key, value = line.split('=', 1)
                  values[key] = value
          assert values['AUDIT_TEXT_MAX_BYTES'] == '8388608'
          assert values['AUDIT_OUTPUT_MAX_TOKENS'] == '128'
          assert values['AUDIT_DISABLE_THINKING'] == 'true'
          assert values['AUDIT_LONG_CONTEXT_THRESHOLD_BYTES'] == '131072'
          assert values['AUDIT_LONG_CONTEXT_TIMEOUT'] == '120s'
          assert values['AUDIT_CONTEXT_TARGET_TOKENS'] == '260000'
          assert values['AUDIT_FALLBACK_CHUNK_BYTES'] == '196608'
          assert values['AUDIT_CHUNK_OVERLAP_BYTES'] == '4096'
          assert values['AUDIT_CHUNK_CONCURRENCY'] == '2'
          assert values['AUDIT_MAX_CHUNKS'] == '64'
          PY
          rm -f .env
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: |
          gofmt -w ./cmd ./internal
          git diff --exit-code
      - name: Verify embedded admin JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("internal/platform/web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("embedded admin script not found")
          Path("/tmp/newapi-risk-admin.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/newapi-risk-admin.js
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Go vet
        run: go vet ./...
      - name: Build services
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
      - name: Validate Compose files
        env:
          POSTGRES_PASSWORD: ci-postgres-password-with-sufficient-length
          MASTER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
          BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-with-sufficient-length
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

  container-smoke:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL, Redis and service
        env:
          POSTGRES_PASSWORD: ci-postgres-password-with-sufficient-length
          MASTER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
          BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-with-sufficient-length
          BIND_ADDRESS: 127.0.0.1
          HTTP_PORT: "18080"
          APP_ENV: production
          KAFKA_ENABLED: "false"
        run: docker compose up -d --build postgres redis risk-platform
      - name: Wait for readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              curl --fail --silent http://127.0.0.1:18080/healthz
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Verify admin login
        run: |
          curl --fail --silent http://127.0.0.1:18080/api/admin/v1/login \
            -H 'Content-Type: application/json' \
            --data '{"username":"admin","password":"ci-admin-password-with-sufficient-length"}' \
            | grep -q 'access_token'
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
