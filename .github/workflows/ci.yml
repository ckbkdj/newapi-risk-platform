name: New API Risk Platform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: newapi-risk-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum

      - name: Verify deployment scripts and environment migration
        run: |
          set -euo pipefail
          bash -n \
            scripts/init-env.sh \
            scripts/deploy-local.sh \
            scripts/doctor.sh \
            scripts/e2e.sh \
            scripts/upgrade.sh \
            scripts/update.sh \
            scripts/upgrade_test.sh
          bash scripts/upgrade_test.sh
          rm -f .env
          bash scripts/init-env.sh >/tmp/init-env-fresh.txt
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def values():
              result = {}
              for line in Path('.env').read_text(encoding='utf-8').splitlines():
                  if line and not line.startswith('#') and '=' in line:
                      key, value = line.split('=', 1)
                      result[key] = value
              return result

          current = values()
          assert len(base64.b64decode(current['MASTER_KEY_B64'], validate=True)) == 32
          assert len(current['JWT_SECRET'].encode()) >= 32
          assert len(current['BOOTSTRAP_ADMIN_PASSWORD']) >= 14
          assert current['POSTGRES_PASSWORD']
          expected = {
              'HTTP_PORT': '8080',
              'REQUEST_MAX_BYTES': '0',
              'REQUEST_HARD_MAX_BYTES': '67108864',
              'REQUEST_LARGE_BODY_THRESHOLD_BYTES': '8388608',
              'REQUEST_LARGE_BODY_MAX_CONCURRENCY': '4',
              'AUDIT_TEXT_MAX_BYTES': '0',
              'AUDIT_OUTPUT_MAX_TOKENS': '256',
              'AUDIT_DISABLE_THINKING': 'true',
              'AUDIT_LONG_CONTEXT_THRESHOLD_BYTES': '131072',
              'AUDIT_LONG_CONTEXT_TIMEOUT': '120s',
              'AUDIT_CONTEXT_TARGET_TOKENS': '0',
              'AUDIT_FALLBACK_CHUNK_BYTES': '196608',
              'AUDIT_CHUNK_OVERLAP_BYTES': '4096',
              'AUDIT_CHUNK_CONCURRENCY': '2',
              'AUDIT_MAX_CHUNKS': '256',
          }
          for key, value in expected.items():
              assert current.get(key) == value, (key, current.get(key), value)

          # Reproduce an old deployment. Existing secret values remain while
          # fixed request/audit limits and the 128-token JSON budget migrate.
          remove = {
              'REQUEST_HARD_MAX_BYTES',
              'REQUEST_LARGE_BODY_THRESHOLD_BYTES',
              'REQUEST_LARGE_BODY_MAX_CONCURRENCY',
              'AUDIT_DISABLE_THINKING',
              'AUDIT_LONG_CONTEXT_THRESHOLD_BYTES',
              'AUDIT_LONG_CONTEXT_TIMEOUT',
              'AUDIT_CONTEXT_TARGET_TOKENS',
              'AUDIT_FALLBACK_CHUNK_BYTES',
              'AUDIT_CHUNK_OVERLAP_BYTES',
              'AUDIT_CHUNK_CONCURRENCY',
          }
          migrated = []
          for line in Path('.env').read_text(encoding='utf-8').splitlines():
              key = line.split('=', 1)[0] if '=' in line else ''
              if key in remove:
                  continue
              if key == 'REQUEST_MAX_BYTES':
                  line = 'REQUEST_MAX_BYTES=67108864'
              elif key == 'AUDIT_TEXT_MAX_BYTES':
                  line = 'AUDIT_TEXT_MAX_BYTES=8388608'
              elif key == 'AUDIT_OUTPUT_MAX_TOKENS':
                  line = 'AUDIT_OUTPUT_MAX_TOKENS=128'
              elif key == 'AUDIT_MAX_CHUNKS':
                  line = 'AUDIT_MAX_CHUNKS=64'
              migrated.append(line)
          Path('.env').write_text('\n'.join(migrated) + '\n', encoding='utf-8')
          PY
          bash scripts/init-env.sh >/tmp/init-env-migrated.txt
          python3 - <<'PY'
          from pathlib import Path
          values = {}
          for line in Path('.env').read_text(encoding='utf-8').splitlines():
              if line and not line.startswith('#') and '=' in line:
                  key, value = line.split('=', 1)
                  values[key] = value
          assert values['REQUEST_MAX_BYTES'] == '0'
          assert values['REQUEST_HARD_MAX_BYTES'] == '67108864'
          assert values['REQUEST_LARGE_BODY_THRESHOLD_BYTES'] == '8388608'
          assert values['REQUEST_LARGE_BODY_MAX_CONCURRENCY'] == '4'
          assert values['AUDIT_TEXT_MAX_BYTES'] == '0'
          assert values['AUDIT_OUTPUT_MAX_TOKENS'] == '256'
          assert values['AUDIT_MAX_CHUNKS'] == '256'
          PY

      - name: Verify module lock and formatting
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          gofmt -w ./cmd ./internal
          git diff --exit-code

      - name: Verify embedded admin JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/newapi-risk-admin.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/newapi-risk-admin.js

      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Audit output fuzz smoke and diagnostic privacy tests
        run: |
          go test ./internal/platform -run '^$' -fuzz '^FuzzAuditOutputDecode$' -fuzztime=10s -parallel=2
          python3 -m py_compile scripts/collect-audit-diagnostics.py scripts/e2e-audit-fusion.py
          python3 scripts/test_collect_audit_diagnostics.py
          bash -n scripts/collect-audit-diagnostics.sh
      - name: Go vet
        run: go vet ./...
      - name: Build services
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

  container-smoke:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL, Redis and service
        env:
          POSTGRES_PASSWORD: ci-postgres-password-with-sufficient-length
          MASTER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789abcdef
          BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-with-sufficient-length
          BIND_ADDRESS: 127.0.0.1
          HTTP_PORT: "18080"
          APP_ENV: production
          KAFKA_ENABLED: "false"
        run: docker compose up -d --build postgres redis risk-platform
      - name: Wait for readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/readyz >/dev/null; then
              curl --fail --silent http://127.0.0.1:18080/healthz
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Verify admin login
        run: |
          curl --fail --silent http://127.0.0.1:18080/api/admin/v1/login \
            -H 'Content-Type: application/json' \
            --data '{"username":"admin","password":"ci-admin-password-with-sufficient-length"}' \
            | grep -q 'access_token'
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
