name: Apply upstream trace fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/trace-upstream-stream-failure-reason
    paths:
      - .github/workflows/apply-upstream-trace-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trace-upstream-stream-failure-reason
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-upstream-trace-fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if label == 'buffered client disconnect':
                  count = text.count(old)
                  if count != 2:
                      raise SystemExit(f"{label}: expected two matches, found {count}")
                  gateway.write_text(text.replace(old, new), encoding="utf-8")
          '''
          new = '''    if label == 'buffered client disconnect':
                  marker = 'func (g *Gateway) proxySSE('
                  before, suffix = text.split(marker, 1)
                  count = suffix.count(old)
                  if count != 2:
                      raise SystemExit(f"{label}: expected two proxySSE matches, found {count}")
                  gateway.write_text(before + marker + suffix.replace(old, new), encoding="utf-8")
          '''
          if old not in text:
              raise SystemExit('client-disconnect patch anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/apply-upstream-trace-fix.py
          gofmt -w ./cmd ./internal
      - name: Validate
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          bash -n scripts/e2e.sh scripts/deploy-local.sh scripts/init-env.sh scripts/doctor.sh
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/admin.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/admin.js
      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add internal/platform/audit_diagnostics.go internal/platform/gateway.go internal/platform/web/index.html scripts/e2e.sh internal/platform/upstream_diagnostics.go internal/platform/upstream_diagnostics_test.go
          if git diff --cached --quiet; then
            echo "already applied"
            exit 0
          fi
          git commit -m "fix(trace): report final upstream stream failure instead of benign audit reason"
          git push origin HEAD:fix/trace-upstream-stream-failure-reason
