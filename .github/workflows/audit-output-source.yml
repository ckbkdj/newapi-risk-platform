name: Audit output source snapshot
on:
  push:
    branches: [fix/audit-output-resilience]
    paths: [.github/workflows/audit-output-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz --output=/tmp/audit-output-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: audit-output-source
          path: /tmp/audit-output-source.tar.gz
          retention-days: 1
          if-no-files-found: error
