name: Audit regression source snapshot

on:
  push:
    branches: [fix/aosp-adb-audit-context]
    paths: [.github/workflows/audit-regression-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Package tracked source and public dependencies for offline regression
        run: |
          set -euo pipefail
          mkdir -p /tmp/audit-regression-source
          git archive HEAD | tar -x -C /tmp/audit-regression-source
          go mod vendor
          cp -a vendor /tmp/audit-regression-source/
          tar -czf /tmp/audit-regression-source.tar.gz -C /tmp/audit-regression-source .
      - uses: actions/upload-artifact@v4
        with:
          name: audit-regression-source
          path: /tmp/audit-regression-source.tar.gz
          retention-days: 1
          if-no-files-found: error
