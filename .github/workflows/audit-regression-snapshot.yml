name: Audit regression source snapshot
on:
  push:
    branches: [fix/aosp-adb-audit-context-20260905]
    paths: [.github/workflows/audit-regression-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > /tmp/audit-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source-snapshot
          path: /tmp/audit-source.tar
          retention-days: 1
