name: Audit regression source snapshot
on:
  push:
    branches: [fix/aosp-adb-audit-context-20260905]
    paths: [.github/workflows/audit-regression-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: true
      - name: Archive tracked source and verified dependencies only
        run: |
          go mod vendor
          git archive --format=tar HEAD > /tmp/audit-source.tar
          tar rf /tmp/audit-source.tar vendor
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source-snapshot
          path: /tmp/audit-source.tar
          retention-days: 1
