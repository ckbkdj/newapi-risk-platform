name: Strict audit integration snapshot
on:
  push:
    branches: [fix/audit-intent-coverage-20260909]
    paths: [.github/workflows/strict-reconcile-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o "$RUNNER_TEMP/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: strict-integration-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
          if-no-files-found: error
