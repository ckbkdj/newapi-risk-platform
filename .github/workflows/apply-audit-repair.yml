name: Apply verified audit repair

on:
  push:
    branches: [fix/audit-intent-coverage-20260909]
    paths: [.github/workflows/apply-audit-repair.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'ckbkdj/newapi-risk-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Verify exact authored patch and apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          names = ['patch.0.b64', 'patch.1.b64'] + [f'tail.{i}.b64' for i in range(6)]
          encoded = ''.join((Path('.audit-repair') / name).read_text().strip() for name in names)
          assert len(encoded) == 33280, len(encoded)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert len(patch) == 81821, len(patch)
          assert digest == '58465990c57b9c8e7dff5e8f2e414096c852a73056e0ed896c1708716d7092e8', digest
          Path('/tmp/audit-repair.patch').write_bytes(patch)
          print('Verified authored patch:', digest)
          PY
          git apply --check /tmp/audit-repair.patch
          git apply --index /tmp/audit-repair.patch
          git rm -r .audit-repair
          git rm .github/workflows/apply-audit-repair.yml
          git diff --cached --check
      - name: Verify repair in full project
        run: |
          set -euo pipefail
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          bash scripts/upgrade_test.sh
          python3 scripts/test_collect_audit_diagnostics.py
          python3 -m py_compile scripts/e2e-audit-coverage.py
      - name: Commit verified source without temporary transport
        run: |
          set -euo pipefail
          test ! -e .audit-repair
          test ! -e .github/workflows/audit-repair-workspace.yml
          test ! -e .github/workflows/apply-audit-repair.yml
          git config user.name 'ckbkdj'
          git config user.email '9382231+ckbkdj@users.noreply.github.com'
          git commit -m 'fix(audit): require credential review and preserve bounded intent coverage'
          git push origin HEAD:fix/audit-intent-coverage-20260909
