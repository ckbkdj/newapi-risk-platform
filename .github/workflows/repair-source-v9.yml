name: Export pinned audit source
on:
  push:
    branches: [fix/preflight-local-dev-v9]
    paths: [.github/workflows/repair-source-v9.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 47ab8bfbf70b66b9d0dd14d2b9c4c16fba16c85a
          persist-credentials: false
      - run: git archive --format=tar HEAD > /tmp/audit-v8-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: audit-v8-source
          path: /tmp/audit-v8-source.tar
          retention-days: 1
