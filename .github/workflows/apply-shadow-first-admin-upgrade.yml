name: Apply shadow-first admin and safe upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - fix/precision-first-engineering-audit
    paths:
      - .github/workflows/apply-shadow-first-admin-upgrade.yml
      - scripts/apply-shadow-first-admin-upgrade.py

permissions:
  contents: write

concurrency:
  group: apply-shadow-first-admin-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/precision-first-engineering-audit
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply integration
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-shadow-first-admin-upgrade.py
          python3 scripts/apply-shadow-first-admin-upgrade.py
          gofmt -w internal/platform/adaptive_admin.go internal/platform/adaptive_admin_test.go internal/platform/http.go
          chmod 0755 scripts/upgrade.sh scripts/update.sh
      - name: Validate source
        run: |
          set -euo pipefail
          git diff --check
          bash -n \
            scripts/e2e.sh \
            scripts/init-env.sh \
            scripts/deploy-local.sh \
            scripts/doctor.sh \
            scripts/upgrade.sh \
            scripts/update.sh
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/newapi-risk-admin.js').write_text('\n'.join(scripts), encoding='utf-8')

          api = Path('docs/openapi.yaml').read_text(encoding='utf-8')
          for marker in (
              '/api/admin/v1/cyber-rule-candidates:',
              '/api/admin/v1/cyber-rule-candidates/{id}/promote:',
              'CyberRuleCandidate:',
              'AdaptiveRulePolicy:',
          ):
              if marker not in api:
                  raise SystemExit(f'OpenAPI marker missing: {marker}')

          upgrade = Path('scripts/upgrade.sh').read_text(encoding='utf-8')
          for marker in ('git merge --ff-only', 'pg_dump', 'rollback()', '.upgrade-backups'):
              if marker not in upgrade:
                  raise SystemExit(f'upgrade safeguard missing: {marker}')
          PY
          node --check /tmp/newapi-risk-admin.js
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add \
            .gitignore \
            Makefile \
            README.md \
            docs/openapi.yaml \
            docs/precision-first-engineering-audit.md \
            internal/platform/adaptive_admin.go \
            internal/platform/adaptive_admin_test.go \
            internal/platform/http.go \
            internal/platform/web/index.html \
            scripts/e2e.sh \
            scripts/update.sh \
            scripts/upgrade.sh
          if git diff --cached --quiet; then
            echo "implementation already applied"
            exit 0
          fi
          git commit -m "fix(audit): add Shadow-first approval and safe upgrades"
          git push origin HEAD:fix/precision-first-engineering-audit
