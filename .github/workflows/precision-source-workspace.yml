name: Precision source workspace
on:
  push:
    branches: [fix/audit-precision-20260909]
    paths: [.github/workflows/precision-source-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive HEAD -o "$RUNNER_TEMP/precision-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: precision-source
          path: ${{ runner.temp }}/precision-source.tar
          retention-days: 1
