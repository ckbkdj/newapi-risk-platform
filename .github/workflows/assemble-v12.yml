name: Assemble verified local credential repair v12
on:
  push:
    branches: [fix/local-credential-semantics-v12]
    paths: [.github/workflows/assemble-v12.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply pinned source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.repair-v12/part{i}.b64').read_text().strip() for i in range(3))
          assert len(encoded) == 21856, 'transport size mismatch'
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 53295, 'patch size mismatch'
          assert hashlib.sha256(patch).hexdigest() == '9d64d4bbf94adfe46f571031edb25fe0aa9ef1ba8033b7ba977450ae0bc1a7d1', 'patch digest mismatch'
          Path('/tmp/v12.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/v12.patch
          git apply --index --unidiff-zero /tmp/v12.patch
          git rm -r .repair-v12
          git rm --cached .github/workflows/source-v12.yml .github/workflows/assemble-v12.yml
          git diff --cached --check
          test "$(git write-tree)" = "6c3cd6fe41d0e361af0b0c555edde48e7cc9b2f8"
          git reset HEAD -- .github/workflows/source-v12.yml .github/workflows/assemble-v12.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(audit): routine local credential use is not disclosure (v12)'
          git push origin HEAD:refs/heads/fix/local-credential-semantics-v12
