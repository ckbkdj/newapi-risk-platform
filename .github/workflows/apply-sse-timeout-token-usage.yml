name: Apply SSE timeout and token usage integration

on:
  workflow_dispatch:
  push:
    branches:
      - fix/sse-timeout-and-token-usage
    paths:
      - .github/workflows/apply-sse-timeout-token-usage.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sse-timeout-and-token-usage
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply integration
        run: |
          set -euo pipefail
          python3 scripts/apply-sse-timeout-token-usage.py
          gofmt -w ./cmd ./internal
      - name: Validate
        run: |
          set -euo pipefail
          bash -n scripts/e2e.sh scripts/deploy-local.sh scripts/init-env.sh scripts/doctor.sh
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/admin.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/admin.js
      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add \
            cmd/mockprovider/main.go \
            docs/upstream-stream-and-token-usage.md \
            internal/platform/audit_diagnostics.go \
            internal/platform/gateway.go \
            internal/platform/upstream_usage.go \
            internal/platform/upstream_usage_test.go \
            internal/platform/web/index.html \
            scripts/e2e.sh
          if git diff --cached --quiet; then
            echo "integration already applied"
            exit 0
          fi
          git commit -m "fix(gateway): use SSE idle timeout and trace upstream token usage"
          git push origin HEAD:fix/sse-timeout-and-token-usage
