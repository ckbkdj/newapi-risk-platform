name: Audit repair pinned dependencies
on:
  push:
    branches: [fix/db-sync-evidence-v7]
    paths: [.github/workflows/repair-deps-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - run: |
          go mod download all
          tar -czf /tmp/go-mod-cache.tar.gz -C "$(go env GOMODCACHE)/cache" download
      - uses: actions/upload-artifact@v4
        with:
          name: audit-pinned-go-deps
          path: /tmp/go-mod-cache.tar.gz
          retention-days: 1
