name: Apply attachment audit foundation v2

on:
  workflow_dispatch:
  push:
    branches:
      - feat/attachment-media-audit
    paths:
      - .github/workflows/apply-attachment-audit-foundation-v2.yml
      - scripts/run-attachment-audit-foundation.py

permissions:
  contents: write

concurrency:
  group: apply-attachment-audit-foundation-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attachment-media-audit
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply foundation
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-attachment-audit-foundation.py scripts/run-attachment-audit-foundation.py
          python3 scripts/run-attachment-audit-foundation.py
          gofmt -w ./cmd ./internal
      - name: Validate
        run: |
          set -euo pipefail
          git diff --check
          bash -n scripts/init-env.sh scripts/deploy-local.sh scripts/upgrade.sh scripts/update.sh
          go mod tidy
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
          rm -f .env
          bash scripts/init-env.sh >/tmp/init-env.txt
          grep -q '^ATTACHMENT_AUDIT_ENABLED=true$' .env
          grep -q '^ATTACHMENT_SAMPLE_MAX_BYTES=1048576$' .env
          rm -f .env
      - name: Commit foundation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add \
            .env.example \
            deploy/kubernetes.yaml \
            docker-compose.yml \
            go.mod go.sum \
            internal/platform/attachment_types.go \
            internal/platform/attachment_discovery.go \
            internal/platform/attachment_fetch.go \
            internal/platform/attachment_extract.go \
            internal/platform/attachment_image.go \
            internal/platform/attachment_foundation_test.go \
            internal/platform/config.go \
            scripts/init-env.sh
          if git diff --cached --quiet; then
            echo "foundation already applied"
            exit 0
          fi
          git commit -m "feat(audit): add bounded attachment extraction foundation"
          git push origin HEAD:feat/attachment-media-audit
