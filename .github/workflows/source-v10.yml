name: Export pinned audit source v10
on:
  push:
    branches: [fix/audit-negation-retry-v10]
    paths: [.github/workflows/source-v10.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e5bc49fb1f9b6f98bd171cfa7baf8412dfb321b0
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > /tmp/audit-v9-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: audit-v9-source
          path: /tmp/audit-v9-source.tar.gz
          retention-days: 1
