name: Apply upstream trace E2E regression

on:
  workflow_dispatch:
  push:
    branches:
      - fix/trace-upstream-stream-failure-reason
    paths:
      - .github/workflows/apply-upstream-trace-e2e.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/trace-upstream-stream-failure-reason
          fetch-depth: 0
      - name: Apply E2E regression
        run: |
          set -euo pipefail
          python3 scripts/add-upstream-trace-e2e.py
          bash -n scripts/e2e.sh
      - name: Commit E2E regression
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add scripts/e2e.sh
          if git diff --cached --quiet; then
            echo "already applied"
            exit 0
          fi
          git commit -m "test(trace): verify final SSE failure diagnostics"
          git push origin HEAD:fix/trace-upstream-stream-failure-reason
