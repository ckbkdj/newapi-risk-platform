name: Finalize v14 test wiring
on:
  push:
    branches: [fix/full-request-audit-v14]
    paths: [.github/workflows/finalize-v14-tests.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'ckbkdj/newapi-risk-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only ordinary source edits with exact preimage checks
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor bf9dcce55721d97bda1c7bd030f4903ba6933986 HEAD
          test "$(git hash-object scripts/e2e.sh)" = 6485442094f0448d6f20a8437de7ec4801e9472c
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/e2e.sh')
          source = path.read_text()
          old = 'assert qm["gateway_build"]["audit_engine"] == "cyber-deny-qwen27b.v13"'
          assert source.count(old) == 1
          source = source.replace(old, old.replace('.v13', '.v14'))
          old = 'BASE_URL="${BASE_URL}" RISK_ADMIN_TOKEN="${TOKEN}" ROUTE_KEY="${ROUTE_KEY}" python3 scripts/e2e-audit-v13.py'
          assert source.count(old) == 1
          source = source.replace(old, old + '\n\n' + old.replace('v13.py', 'v14.py'))
          path.write_text(source)
          path = Path('AGENTS.md')
          source = path.read_text()
          header = '# Full-request auditing v14 (2026-09-10)\n\nAccepted long requests must be completely audited without the old secondary 2 MiB or fixed cumulative call-count cliff. This supersedes older fixed-budget and mandatory 120-second total-lifetime descriptions below, not content-denial or coverage rules. Default total timeout and max chunks are zero (operator-configurable); required chunk work is finitely planned. Preserve per-call timeout, bounded retries/replanning, caller cancellation, integer-overflow guards, global model concurrency, ingress/extraction protections and every prior regression. No unfinished audit, invalid tail or model failure authorizes forwarding.\n\nThe supplied 22-chunk trace already allowed all content then recorded client disconnect. Do not claim this change fixes external client/proxy timeouts. Complete final-head CI and Docker HTTP/SSE tests, including the explicitly invoked v14 suite, must pass before squash merge. Temporary maintenance workflows must not be present in the merged tree.\n\n'
          assert not source.startswith('# Full-request auditing v14')
          path.write_text(header + source)
          PY
          bash -n scripts/e2e.sh
          git add scripts/e2e.sh AGENTS.md
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/fix/full-request-audit-v14 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'ckbkdj'
          git config user.email '9382231+ckbkdj@users.noreply.github.com'
          git commit -m 'test: wire full v14 HTTP/SSE suite without replacing existing checks'
          git push origin HEAD:refs/heads/fix/full-request-audit-v14
          git rev-parse HEAD > "$RUNNER_TEMP/v14-source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/v14-source-tree.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/v14-reviewed-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: v14-reviewed-source
          path: |
            ${{ runner.temp }}/v14-reviewed-source.tar.gz
            ${{ runner.temp }}/v14-source-commit.txt
            ${{ runner.temp }}/v14-source-tree.txt
          retention-days: 1
