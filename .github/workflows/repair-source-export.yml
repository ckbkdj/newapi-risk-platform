name: Audit repair source export
on:
  push:
    branches: [fix/db-sync-evidence-v7]
    paths: [.github/workflows/repair-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > /tmp/audit-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source
          path: /tmp/audit-source.tar
          retention-days: 1
