name: Apply complete audit text extraction

on:
  workflow_dispatch:
  push:
    branches:
      - fix/complete-audit-text-for-auto-bodies
    paths:
      - .github/workflows/apply-complete-audit-text.yml
      - scripts/apply-complete-audit-text.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-audit-text-for-auto-bodies
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache-dependency-path: go.sum
      - name: Apply patch
        run: |
          set -euo pipefail
          python3 scripts/apply-complete-audit-text.py
          gofmt -w ./cmd ./internal
      - name: Validate
        run: |
          set -euo pipefail
          bash -n scripts/e2e.sh scripts/deploy-local.sh scripts/init-env.sh scripts/doctor.sh
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/riskd ./cmd/riskd
          CGO_ENABLED=0 go build -trimpath -o /tmp/mockprovider ./cmd/mockprovider
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('internal/platform/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('embedded admin script not found')
          Path('/tmp/admin.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/admin.js
          docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet
          rm -f .env
          bash scripts/init-env.sh >/tmp/init-env.txt
          grep -q '^AUDIT_TEXT_MAX_BYTES=0$' .env
          grep -q '^AUDIT_MAX_CHUNKS=256$' .env
          rm -f .env
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+ckbkdj@users.noreply.github.com"
          git add \
            .env.example \
            .github/workflows/ci.yml \
            deploy/kubernetes.yaml \
            docker-compose.yml \
            docs/automatic-body-timeline-and-role-aware-audit.md \
            internal/platform/admin.go \
            internal/platform/audit.go \
            internal/platform/audit_text_limit.go \
            internal/platform/audit_text_limit_test.go \
            internal/platform/config.go \
            internal/platform/gateway.go \
            internal/platform/types.go \
            internal/platform/web/index.html \
            scripts/init-env.sh
          if git diff --cached --quiet; then
            echo "implementation already applied"
            exit 0
          fi
          git commit -m "fix(audit): inspect all accepted large-request text"
          git push origin HEAD:fix/complete-audit-text-for-auto-bodies
